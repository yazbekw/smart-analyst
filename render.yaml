services:
  - type: web
    name: smart-analyst
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: EXCHANGE_ID
        value: coinex
      - key: SYMBOLS
        value: BTC/USDT,ETH/USDT,BNB/USDT,SOL/USDT
      - key: SCAN_INTERVAL_MINUTES
        value: "15"
      - key: NOTIFY_ONLY_ON_CHANGE
        value: "true"
      - key: MIN_NOTIFY_SCORE
        value: "8"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: NTFY_TOPIC
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
